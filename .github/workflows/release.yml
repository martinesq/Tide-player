name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag or ref to build; optional for build-only runs
        required: false
        type: string
      build_only:
        description: Build and validate the installer without publishing it
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag matches package.json version
        if: inputs.build_only != true
        shell: pwsh
        run: |
          $releaseTag = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = node -p "require('./package.json').version"
          if ($releaseTag -ne "v$version") {
            throw "Tag $releaseTag does not match package.json version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build native addons
        run: npm run build:native

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

      - name: Package and publish the NSIS installer
        shell: pwsh
        run: |
          $publishArg = if ("${{ inputs.build_only }}" -eq "true") { "never" } else { "always" }
          & ./node_modules/.bin/electron-builder.cmd `
            --win nsis `
            --config electron-builder.config.cjs `
            --publish $publishArg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save build-only installer
        if: inputs.build_only == true
        uses: actions/upload-artifact@v7
        with:
          name: tide-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 7
